server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8081}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/field-service;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
app:
  time-zone: ${APP_TIME_ZONE:America/New_York}
  demo-enabled: ${DEMO_ENABLED:true}
  demo-password: ${DEMO_PASSWORD:}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:}
  maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  maps-embed-key: ${GOOGLE_MAPS_EMBED_KEY:}
